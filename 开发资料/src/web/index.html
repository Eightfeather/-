<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Lethe Workbench</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div id="app">
  <main id="view" class="view"></main>

  <!-- 底栏：主行（名片 + 导航键）+ 状态行（永远在最上层，切页保留） -->
  <footer class="dock">
    <div class="dock-main">
      <div class="namecard" id="namecard">
        <div class="nc-cell nc-name">
          <span class="nc-label">编辑者</span>
          <strong class="nc-strong" id="nc-name">但丁</strong>
        </div>
        <div class="nc-void"></div>
        <div class="nc-cell nc-mod">
          <span class="nc-label">Mod 数</span>
          <strong class="nc-strong" id="nc-mod">—</strong>
        </div>
        <div class="nc-cell nc-dll">
          <span class="nc-label">DLL 数</span>
          <strong class="nc-strong" id="nc-dll">—</strong>
        </div>
        <div class="nc-cell nc-editor">
          <span class="nc-label">编辑器</span>
          <strong class="nc-mid" id="nc-editor">边狱工作台 Limbus Workshop</strong>
          <small class="muted" id="nc-editorsub">The Lethe Workbench</small>
        </div>
        <div class="nc-cell nc-size">
          <span class="nc-label">Mod 总体积</span>
          <strong class="nc-strong" id="nc-size">—</strong>
        </div>
      </div>
      <nav class="dock-nav">
        <button class="dock-item" data-view="home"><span class="dock-icon">⌂</span><span>主页</span><small>HOME</small></button>
        <button class="dock-item" data-view="mods"><span class="dock-icon">◆</span><span>Mod 管理</span><small>MANAGE</small></button>
        <button class="dock-item" data-view="edit"><span class="dock-icon">✦</span><span>Mod 编辑</span><small>EDIT</small></button>
        <button class="dock-item" data-view="import"><span class="dock-icon">⇩</span><span>Mod 导入</span><small>IMPORT</small></button>
      </nav>
    </div>
    <div class="dock-status">
      <span class="dot" id="root-dot"></span>
      <span id="st-root">尚未定位私服</span>
      <span class="sep">|</span>
      <span>当前 Mod <strong id="st-mod">—</strong></span>
      <span class="sep">|</span>
      <span id="st-dirty" class="calm">已保存</span>
      <span class="sep">|</span>
      <span id="st-auto" class="muted">自动快照 —</span>
      <span class="spacer"></span>
      <button class="btn ghost sm" id="btn-locate">重新定位</button>
      <button class="btn ghost sm" id="btn-settings">设置</button>
      <span id="st-version" class="muted"></span>
    </div>
  </footer>

  <div id="toasts" class="toasts"></div>
  <div id="modal-root"></div>
</div>
<script>window.__WB_TOKEN__ = "%%WB_TOKEN%%";</script>
<script type="module" src="/app.js"></script>
</body>
</html>
